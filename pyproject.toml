[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-ternary-search"
version = "0.1.0"
description = "Gradient-free stochastic training of ternary neural networks"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
plots = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["sts*"]

[tool.setuptools.package-data]
sts = ["*.json", "*.so", "native/*.cpp", "native/*.hpp"]
